baseurl = 'https://charlietap.github.io/'
locale = 'en-gb'
defaultcontentlanguage = 'en'
title = 'charlietap'
timezone = 'Europe/London'
enableemoji = false
enablegitinfo = false
disablekinds = ['taxonomy', 'term']

[params]
description = 'thoughts and lessons learned in software, life and business'
github = 'https://github.com/charlietap'

[permalinks.page]
posts = '/writing/:slugorcontentbasename/'

[outputs]
home = ['html', 'rss']
section = ['html']

[markup.highlight]
style = 'github'
tabwidth = 4

[markup.goldmark.renderer]
unsafe = false

[sitemap]
filename = 'sitemap.xml'

[caches.images]
dir = ':cacheDir/images'
