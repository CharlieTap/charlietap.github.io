name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: read
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: setup
        uses: ./.github/actions/setup
      - name: check publication dates
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: prepare articles
        run: python scripts/prepare_posts.py
      - name: build
        run: hugo --gc --minify --cleanDestinationDir --panicOnWarning
      - name: check site
        run: python scripts/check_site.py
      - name: save first publication dates
        run: |
          if ! git diff --quiet -- content/posts; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add content/posts
            git commit -m 'record publication dates'
            git push origin HEAD:main
          fi
      - name: configure pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
